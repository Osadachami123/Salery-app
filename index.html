<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Salary Tracker | Clean UI + Week Grouping</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070c;--sur:#0a0f16;--card:#0f1622;--bdr:#1e293b;
  --ac:#6366f1;--ac2:#f59e0b;--green:#10b981;--red:#f43f5e;
  --tx:#f1f5f9;--mu:#6b7280;--sm:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:15px;}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;z-index:1;}
.login-box{background:rgba(15,22,34,.95);backdrop-filter:blur(8px);border:1px solid rgba(99,102,241,.4);border-radius:40px;padding:44px 40px;width:100%;max-width:400px;}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--ac),#8b5cf6);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 16px;}
.field{margin-bottom:16px;}
.field input{width:100%;background:var(--sur);border:1.5px solid var(--bdr);border-radius:14px;padding:13px 16px;color:var(--tx);}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff;font-weight:600;padding:14px;border:none;border-radius:14px;cursor:pointer;}
.login-err{color:var(--red);font-size:.8rem;text-align:center;margin-top:10px;}

#app{display:none;max-width:560px;margin:0 auto;}
.app-header{position:sticky;top:0;background:rgba(7,9,15,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;z-index:100;}
.logout-btn{background:none;border:1px solid var(--bdr);color:var(--mu);padding:6px 14px;border-radius:10px;cursor:pointer;}

.tab-bar{display:flex;padding:0 16px;border-bottom:1px solid var(--bdr);gap:4px;overflow-x:auto;background:var(--bg);}
.tab-btn{background:none;border:none;color:var(--mu);font-size:.8rem;font-weight:500;padding:14px 18px;cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--ac);border-bottom-color:var(--ac);}
.tab-panel{display:none;padding:20px;}
.tab-panel.active{display:block;}

/* Dashboard Cards */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:16px 18px;}
.card-val{font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:500;}
.card-val.large{font-size:1.8rem;}
.card-val.indigo{color:var(--ac);}
.card-val.green{color:var(--green);}
.card-val.amber{color:var(--ac2);}
.card-label{font-size:.65rem;font-weight:600;color:var(--mu);margin-bottom:8px;letter-spacing:.05em;}
.card-sub{font-size:.7rem;color:var(--mu);margin-top:5px;}

/* All Time Special Card */
.alltime-card{background:linear-gradient(135deg,var(--card),#0a0f16);border:2px solid var(--ac);border-radius:24px;padding:20px;text-align:center;margin-bottom:20px;}
.alltime-card .card-label{font-size:.7rem;color:var(--ac);letter-spacing:.1em;}
.alltime-card .card-val{font-size:2.2rem;font-weight:700;color:var(--green);}
.alltime-card .card-sub{font-size:.7rem;color:var(--mu);}

.progress-bar{height:6px;background:var(--bdr);border-radius:10px;margin-bottom:6px;}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--green));}
.sec-lbl{font-size:.68rem;font-weight:600;color:var(--mu);margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--bdr);}

.form-card{background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:22px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.fg label{font-size:.68rem;font-weight:600;color:var(--mu);display:block;margin-bottom:6px;}
.fg input,.fg select{width:100%;background:var(--sur);border:1.5px solid var(--bdr);border-radius:14px;padding:12px 14px;color:var(--tx);}
.btn-save{background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff;font-weight:600;padding:12px;border:none;border-radius:14px;cursor:pointer;width:100%;}

.weekly-report-card{background:linear-gradient(135deg,#0f1622,#0a0f16);border:2px solid var(--ac);border-radius:24px;padding:20px;margin-bottom:20px;}
.week-nav{display:flex;gap:10px;margin-bottom:20px;align-items:center;justify-content:space-between;}
.week-nav button{background:var(--sur);border:1.5px solid var(--bdr);color:var(--tx);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:.8rem;}
.week-nav button:hover{border-color:var(--ac);}
.week-nav span{font-family:'DM Mono',monospace;font-size:.85rem;background:var(--sur);padding:8px 16px;border-radius:20px;}
.week-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-box{text-align:center;padding:12px;background:var(--sur);border-radius:16px;}
.stat-label{font-size:.65rem;color:var(--mu);}
.stat-value{font-family:'DM Mono',monospace;font-size:1.3rem;font-weight:600;color:var(--green);}
.week-breakdown{max-height:280px;overflow-y:auto;}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--bdr);font-size:.8rem;}
.day-row.highlight{background:rgba(99,102,241,.15);border-radius:12px;}
.badge-bonus{background:rgba(245,158,11,.2);color:var(--ac2);padding:6px 12px;border-radius:20px;font-size:.7rem;text-align:center;margin-top:12px;}

.range-preview{max-height:180px;overflow-y:auto;}
.range-day-item{display:flex;justify-content:space-between;padding:8px 12px;background:var(--sur);border-radius:12px;margin-bottom:4px;}

/* History with Week Grouping */
.history-week-group{margin-bottom:20px;}
.week-header{background:var(--sur);border-left:3px solid var(--ac);padding:10px 15px;margin:8px 0 6px;border-radius:12px;font-size:.75rem;font-weight:600;color:var(--ac);display:flex;justify-content:space-between;align-items:center;}
.week-header span:first-child{font-family:'DM Mono',monospace;}
.week-header span:last-child{color:var(--green);}
.hist-table{width:100%;border-collapse:collapse;}
.hist-table th,.hist-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bdr);}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e2a1e;border:1px solid var(--green);color:var(--green);padding:10px 24px;border-radius:40px;opacity:0;transition:all .28s;z-index:999;pointer-events:none;}
#toast.show{opacity:1;}

input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer;}
input[type="date"]{color-scheme:dark;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">💰</div>
    <h2 style="text-align:center;margin-bottom:20px;">Salary Tracker</h2>
    <div class="field"><label>Email</label><input type="email" id="em"></div>
    <div class="field"><label>Password</label><input type="password" id="pw"></div>
    <button class="btn-primary" id="btn-login">Login</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header class="app-header"><span style="font-weight:700;">💰 Salary Tracker</span><button class="logout-btn" id="btn-logout">Logout</button></header>
  
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="weekly">📊 Weekly</button>
    <button class="tab-btn" data-tab="attendance">📝 Attendance</button>
    <button class="tab-btn" data-tab="history">📜 History</button>
    <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
  </div>

  <!-- DASHBOARD - All Time big and prominent -->
  <div class="tab-panel active" id="tab-dashboard">
    <!-- All Time Salary - BIG -->
    <div class="alltime-card">
      <div class="card-label">💰 TOTAL EARNED (ALL TIME)</div>
      <div class="card-val" id="card-total">—</div>
      <div class="card-sub">lifetime salary</div>
    </div>
    
    <div class="cards-grid">
      <div class="card"><div class="card-label">Today</div><div class="card-val indigo" id="card-today">—</div><div class="card-sub" id="card-today-sub"></div></div>
      <div class="card"><div class="card-label">This Week (Mon-Sun)</div><div class="card-val green" id="card-week">—</div><div class="card-sub" id="card-week-sub"></div></div>
      <div class="card"><div class="card-label">This Month</div><div class="card-val amber" id="card-month">—</div><div class="card-sub" id="card-month-sub"></div></div>
      <div class="card"><div class="card-label">Previous Week</div><div class="card-val green" id="card-prev-week">—</div><div class="card-sub" id="card-prev-week-sub"></div></div>
    </div>
    
    <div class="card"><div class="card-label">Monthly Progress</div><div class="progress-bar"><div class="progress-fill" id="month-prog" style="width:0%"></div></div><div class="card-sub"><span id="prog-done">0</span> / <span id="prog-goal">30</span> days worked</div></div>
    
    <div class="card"><div class="card-label">🔥 Current Streak</div><div class="card-val indigo" id="card-streak">—</div><div class="card-sub">consecutive work days</div></div>
  </div>

  <!-- WEEKLY REPORT -->
  <div class="tab-panel" id="tab-weekly">
    <div class="weekly-report-card">
      <div class="week-nav">
        <button id="prev-week-btn">◀ පෙර</button>
        <span id="current-week-label">--</span>
        <button id="next-week-btn">ඊළඟ ▶</button>
      </div>
      <div id="week-report-content">
        <div style="text-align:center;color:var(--mu);padding:20px;">සතියක් තෝරන්න</div>
      </div>
    </div>
  </div>

  <!-- ATTENDANCE -->
  <div class="tab-panel" id="tab-attendance">
    <div class="form-card">
      <div class="frow"><div class="fg"><label>📅 Date</label><input type="date" id="att-date"></div><div class="fg"><label>📋 Type</label><select id="att-type"><option value="work">💼 Work Day</option><option value="sunday">☀️ Sunday</option><option value="off">😴 Off Day</option></select></div></div>
      <div class="frow"><div class="fg"><label>⏱️ Overtime (hrs)</label><input type="number" id="att-ot" placeholder="0" min="0" step="0.5" value="0"></div><div class="fg"><button class="btn-save" id="btn-save-day">✓ Save Day</button></div></div>
    </div>
    <div class="sec-lbl">📆 Date Range (Batch Mark)</div>
    <div class="form-card">
      <div class="frow"><div class="fg"><label>From</label><input type="date" id="range-from"></div><div class="fg"><label>To</label><input type="date" id="range-to"></div></div>
      <div class="frow"><div class="fg"><label>Day Type</label><select id="range-type"><option value="work">Work Days (skip Sun)</option><option value="all-work">All as Work</option><option value="sunday">All as Sunday</option><option value="off">All as Off</option></select></div><div class="fg"><label>OT per day</label><input type="number" id="range-ot" value="0" step="0.5"></div></div>
      <button class="btn-save" id="btn-preview-range">👁️ Preview</button>
      <div class="range-preview" id="range-preview"></div>
      <button class="btn-save" id="btn-save-range" style="display:none;margin-top:12px;background:linear-gradient(135deg,var(--green),#16a34a);">💾 Save All</button>
    </div>
  </div>

  <!-- HISTORY - WITH WEEK GROUPING -->
  <div class="tab-panel" id="tab-history">
    <select id="hist-filter" style="width:100%;background:var(--sur);border:1.5px solid var(--bdr);border-radius:14px;padding:12px;margin-bottom:16px;">
      <option value="all">📅 All Time</option>
    </select>
    <div id="history-grouped-container"></div>
  </div>

  <!-- SETTINGS -->
  <div class="tab-panel" id="tab-settings">
    <div class="form-card">
      <div class="frow"><div class="fg"><label>Work Day Rate (Rs)</label><input type="number" id="r-daily" value="1750"></div><div class="fg"><label>Sunday Rate (Rs)</label><input type="number" id="r-sunday" value="1750"></div></div>
      <div class="frow"><div class="fg"><label>Overtime (per hr)</label><input type="number" id="r-ot" value="218"></div><div class="fg"><label>Week Bonus (Rs)</label><input type="number" id="r-bonus" value="600"></div></div>
      <button class="btn-save" id="btn-save-rates">💾 Save Rates</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7L_dB7gZWKk0EVE1xNs4egkxjwHFTLiE",
  authDomain: "my-salary-tracker-be4a5.firebaseapp.com",
  projectId: "my-salary-tracker-be4a5",
  storageBucket: "my-salary-tracker-be4a5.firebasestorage.app",
  messagingSenderId: "202519677110",
  appId: "1:202519677110:web:d828b2e26b2063cac9fe17"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let RATES = { daily: 1750, ot: 218, sunday: 1750, weekBonus: 600 };

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show';
  setTimeout(() => t.className = '', 2500);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'history') renderHistoryWithGroups();
    if (btn.dataset.tab === 'dashboard') renderDashboard();
  });
});

document.getElementById('btn-login').addEventListener('click', async () => {
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('em').value, document.getElementById('pw').value);
  } catch(e) {
    document.getElementById('login-err').textContent = 'Wrong email/password';
  }
});
document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadRates();
    renderDashboard();
    document.getElementById('att-date').value = new Date().toISOString().slice(0,10);
    loadWeeklyReportForDate(new Date());
    populateMonthFilter();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function formatDateYMD(date) {
  let d = new Date(date);
  let year = d.getFullYear();
  let month = String(d.getMonth() + 1).padStart(2, '0');
  let day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function getMondayOfWeek(date) {
  let d = new Date(date);
  let day = d.getDay();
  let diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekRangeStr(monday) {
  let sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  let monStr = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  let sunStr = sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  return `${monStr} - ${sunStr}`;
}

function calculateEarning(rec) {
  if (!rec || rec.type === 'off') return 0;
  let base = rec.type === 'sunday' ? RATES.sunday : RATES.daily;
  let ot = rec.ot || 0;
  return base + (ot * RATES.ot);
}

async function getAllRecords() {
  let snap = await getDocs(collection(db, 'attendance'));
  let map = {};
  snap.forEach(d => map[d.id] = d.data());
  return map;
}

async function loadRates() {
  let s = await getDoc(doc(db, 'settings', 'rates'));
  if (s.exists()) RATES = { ...RATES, ...s.data() };
  document.getElementById('r-daily').value = RATES.daily;
  document.getElementById('r-ot').value = RATES.ot;
  document.getElementById('r-sunday').value = RATES.sunday;
  document.getElementById('r-bonus').value = RATES.weekBonus;
}

document.getElementById('btn-save-rates').addEventListener('click', async () => {
  RATES.daily = +document.getElementById('r-daily').value;
  RATES.ot = +document.getElementById('r-ot').value;
  RATES.sunday = +document.getElementById('r-sunday').value;
  RATES.weekBonus = +document.getElementById('r-bonus').value;
  await setDoc(doc(db, 'settings', 'rates'), RATES);
  toast('Rates saved');
  renderDashboard();
  if (currentMonday) loadWeeklyReportForDate(currentMonday);
  renderHistoryWithGroups();
});

async function renderDashboard() {
  let records = await getAllRecords();
  let today = new Date();
  let todayStr = formatDateYMD(today);
  let todayRec = records[todayStr];
  let todayEarn = calculateEarning(todayRec);
  
  let thisMonday = getMondayOfWeek(today);
  let weekTotal = 0, weekDays = 0;
  for (let i = 0; i < 7; i++) {
    let d = new Date(thisMonday);
    d.setDate(thisMonday.getDate() + i);
    let key = formatDateYMD(d);
    if (records[key] && records[key].type !== 'off') {
      weekTotal += calculateEarning(records[key]);
      weekDays++;
    }
  }
  let weekBonus = weekDays >= 6;
  if (weekBonus) weekTotal += RATES.weekBonus;
  
  let prevMonday = new Date(thisMonday);
  prevMonday.setDate(thisMonday.getDate() - 7);
  let prevTotal = 0, prevDays = 0;
  for (let i = 0; i < 7; i++) {
    let d = new Date(prevMonday);
    d.setDate(prevMonday.getDate() + i);
    let key = formatDateYMD(d);
    if (records[key] && records[key].type !== 'off') {
      prevTotal += calculateEarning(records[key]);
      prevDays++;
    }
  }
  if (prevDays >= 6) prevTotal += RATES.weekBonus;
  
  let currentMonth = todayStr.slice(0,7);
  let monthTotal = 0, monthDays = 0;
  let monthWeeks = {};
  for (let [date, rec] of Object.entries(records)) {
    if (date.startsWith(currentMonth) && (rec.type === 'work' || rec.type === 'sunday')) {
      monthTotal += calculateEarning(rec);
      monthDays++;
      let d = new Date(date);
      let weekStart = formatDateYMD(getMondayOfWeek(d));
      monthWeeks[weekStart] = (monthWeeks[weekStart] || 0) + 1;
    }
  }
  let monthBonusCount = 0;
  for (let days of Object.values(monthWeeks)) {
    if (days >= 6) { monthTotal += RATES.weekBonus; monthBonusCount++; }
  }
  
  let allTotal = 0;
  for (let rec of Object.values(records)) allTotal += calculateEarning(rec);
  
  let streak = 0;
  let check = new Date(today);
  while (true) {
    let key = formatDateYMD(check);
    let rec = records[key];
    if (rec && rec.type !== 'off') { streak++; check.setDate(check.getDate() - 1); }
    else break;
  }
  
  let daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  let percent = Math.min(100, Math.round((monthDays / daysInMonth) * 100));
  
  document.getElementById('card-today').innerHTML = todayRec ? (todayRec.type === 'off' ? 'Off' : `Rs.${todayEarn.toLocaleString()}`) : '—';
  document.getElementById('card-today-sub').innerHTML = todayRec ? (todayRec.ot ? `${todayRec.ot}h OT` : 'Regular') : 'Not marked';
  document.getElementById('card-week').innerHTML = `Rs.${weekTotal.toLocaleString()}`;
  document.getElementById('card-week-sub').innerHTML = `${weekDays}/7 days${weekBonus ? ' +Bonus' : ''}`;
  document.getElementById('card-month').innerHTML = `Rs.${monthTotal.toLocaleString()}`;
  document.getElementById('card-month-sub').innerHTML = `${monthDays} days (${monthBonusCount} bonuses)`;
  document.getElementById('card-total').innerHTML = `Rs.${allTotal.toLocaleString()}`;
  document.getElementById('card-streak').innerHTML = streak;
  document.getElementById('card-prev-week').innerHTML = prevTotal > 0 ? `Rs.${prevTotal.toLocaleString()}` : 'No data';
  document.getElementById('card-prev-week-sub').innerHTML = prevDays > 0 ? `${prevDays} days worked` : 'Mark last week';
  document.getElementById('month-prog').style.width = percent + '%';
  document.getElementById('prog-done').innerHTML = monthDays;
  document.getElementById('prog-goal').innerHTML = daysInMonth;
}

let currentMonday = null;

async function loadWeeklyReportForDate(date) {
  currentMonday = getMondayOfWeek(date);
  let monday = new Date(currentMonday);
  let sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  document.getElementById('current-week-label').innerHTML = `${monday.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${sunday.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`;
  
  let records = await getAllRecords();
  let dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  let dayDetails = [];
  let weekTotal = 0, workDays = 0, totalOt = 0;
  
  for (let i = 0; i < 7; i++) {
    let d = new Date(monday);
    d.setDate(monday.getDate() + i);
    let dateStr = formatDateYMD(d);
    let rec = records[dateStr];
    let earned = 0, type = 'Not marked', ot = 0;
    if (rec) {
      ot = rec.ot || 0;
      if (rec.type === 'work') { earned = RATES.daily + (ot * RATES.ot); type = 'Work'; workDays++; }
      else if (rec.type === 'sunday') { earned = RATES.sunday + (ot * RATES.ot); type = 'Sunday'; workDays++; }
      else { earned = 0; type = 'Off'; }
      totalOt += ot; weekTotal += earned;
    }
    dayDetails.push({ dayName: dayNames[i], dateStr, type, ot, earned, isToday: dateStr === formatDateYMD(new Date()) });
  }
  let gotBonus = false;
  if (workDays >= 6) { weekTotal += RATES.weekBonus; gotBonus = true; }
  
  document.getElementById('week-report-content').innerHTML = `
    <div class="week-stats">
      <div class="stat-box"><div class="stat-label">Total Salary</div><div class="stat-value">Rs. ${weekTotal.toLocaleString()}</div></div>
      <div class="stat-box"><div class="stat-label">Work Days</div><div class="stat-value">${workDays}/7</div></div>
      <div class="stat-box"><div class="stat-label">OT Hours</div><div class="stat-value">${totalOt}h</div></div>
      <div class="stat-box"><div class="stat-label">Bonus</div><div class="stat-value">${gotBonus ? `✓ Rs.${RATES.weekBonus}` : '—'}</div></div>
    </div>
    <div class="week-breakdown">
      ${dayDetails.map(d => `<div class="day-row ${d.isToday ? 'highlight' : ''}">
        <div><strong>${d.dayName}</strong><br><span style="font-size:.7rem;color:var(--mu);">${d.dateStr}</span></div>
        <div style="color:${d.type === 'Work' ? 'var(--green)' : d.type === 'Sunday' ? 'var(--ac2)' : '#6b7280'};">${d.type}${d.ot > 0 ? ` +${d.ot}h` : ''}</div>
        <div style="font-weight:600;color:var(--green);">${d.earned > 0 ? `Rs.${d.earned.toLocaleString()}` : '—'}</div>
      </div>`).join('')}
    </div>`;
}

document.getElementById('prev-week-btn').addEventListener('click', () => {
  if (currentMonday) { let newDate = new Date(currentMonday); newDate.setDate(currentMonday.getDate() - 7); loadWeeklyReportForDate(newDate); }
});
document.getElementById('next-week-btn').addEventListener('click', () => {
  if (currentMonday) { let newDate = new Date(currentMonday); newDate.setDate(currentMonday.getDate() + 7); loadWeeklyReportForDate(newDate); }
});

document.getElementById('btn-save-day').addEventListener('click', async () => {
  let date = document.getElementById('att-date').value;
  let type = document.getElementById('att-type').value;
  let ot = parseFloat(document.getElementById('att-ot').value) || 0;
  if (!date) { toast('Select a date', true); return; }
  await setDoc(doc(db, 'attendance', date), { type, ot });
  toast('Saved ✓');
  renderDashboard();
  if (currentMonday) loadWeeklyReportForDate(currentMonday);
  renderHistoryWithGroups();
});

let previewDays = [];
document.getElementById('btn-preview-range').addEventListener('click', () => {
  let from = document.getElementById('range-from').value, to = document.getElementById('range-to').value;
  if (!from || !to) { toast('Select dates', true); return; }
  let rangeType = document.getElementById('range-type').value;
  let ot = parseFloat(document.getElementById('range-ot').value) || 0;
  let dates = [], d = new Date(from);
  while (d <= new Date(to)) { dates.push(formatDateYMD(d)); d.setDate(d.getDate() + 1); }
  previewDays = dates.map(date => {
    let dow = new Date(date).getDay();
    let type = null;
    if (rangeType === 'work') type = dow === 0 ? null : 'work';
    else if (rangeType === 'all-work') type = 'work';
    else if (rangeType === 'sunday') type = 'sunday';
    else type = 'off';
    return type ? { date, type, ot: type === 'off' ? 0 : ot } : null;
  }).filter(Boolean);
  let typeNames = { work: 'Work', sunday: 'Sunday', off: 'Off' };
  document.getElementById('range-preview').innerHTML = previewDays.map(p => `<div class="range-day-item"><span>${p.date}</span><span>${typeNames[p.type]} ${p.ot ? `+${p.ot}h` : ''}</span></div>`).join('');
  document.getElementById('btn-save-range').style.display = previewDays.length ? 'block' : 'none';
});

document.getElementById('btn-save-range').addEventListener('click', async () => {
  if (!previewDays.length) return;
  let batch = writeBatch(db);
  previewDays.forEach(d => batch.set(doc(db, 'attendance', d.date), { type: d.type, ot: d.ot }));
  await batch.commit();
  toast(`${previewDays.length} days saved ✓`);
  document.getElementById('range-preview').innerHTML = '';
  document.getElementById('btn-save-range').style.display = 'none';
  previewDays = [];
  renderDashboard();
  if (currentMonday) loadWeeklyReportForDate(currentMonday);
  renderHistoryWithGroups();
});

// HISTORY WITH WEEK GROUPING
async function renderHistoryWithGroups() {
  let records = await getAllRecords();
  let filter = document.getElementById('hist-filter').value;
  let filtered = {};
  for (let [date, rec] of Object.entries(records)) {
    if (filter === 'all' || date.startsWith(filter)) filtered[date] = rec;
  }
  
  let sorted = Object.entries(filtered).sort((a,b) => b[0].localeCompare(a[0]));
  if (sorted.length === 0) {
    document.getElementById('history-grouped-container').innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu);">No records yet</div>';
    return;
  }
  
  // Group by week (Monday to Sunday)
  let weeksMap = new Map();
  let dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  
  for (let [date, rec] of sorted) {
    let dateObj = new Date(date);
    let weekMonday = getMondayOfWeek(dateObj);
    let weekKey = formatDateYMD(weekMonday);
    if (!weeksMap.has(weekKey)) {
      weeksMap.set(weekKey, { monday: weekMonday, records: [] });
    }
    weeksMap.get(weekKey).records.push({ date, rec });
  }
  
  // Sort weeks by date (newest first)
  let sortedWeeks = Array.from(weeksMap.keys()).sort((a,b) => b.localeCompare(a));
  
  let html = '';
  for (let weekKey of sortedWeeks) {
    let weekData = weeksMap.get(weekKey);
    let weekRange = getWeekRangeStr(weekData.monday);
    let weekTotal = 0;
    for (let item of weekData.records) {
      weekTotal += calculateEarning(item.rec);
    }
    
    html += `<div class="history-week-group">
      <div class="week-header">
        <span>📅 ${weekRange}</span>
        <span>💰 Rs. ${weekTotal.toLocaleString()}</span>
      </div>
      <table class="hist-table">
        <tbody>`;
    
    for (let item of weekData.records) {
      let earn = calculateEarning(item.rec);
      let dateObj = new Date(item.date);
      let dayName = dayNames[dateObj.getDay()];
      html += `<tr>
        <td style="font-family:monospace;">${item.date}</td>
        <td style="font-size:.7rem;color:var(--sm);">${dayName}</td>
        <td>${item.rec.type === 'work' ? '💼 Work' : item.rec.type === 'sunday' ? '☀️ Sunday' : '😴 Off'}</td>
        <td>${item.rec.ot ? item.rec.ot + 'h' : '-'}</td>
        <td style="color:var(--green);font-weight:500;">${earn > 0 ? 'Rs.' + earn.toLocaleString() : '-'}</td>
        <td><button class="del-btn" data-date="${item.date}">✕</button></td>
      </tr>`;
    }
    
    html += `</tbody></table></div>`;
  }
  
  document.getElementById('history-grouped-container').innerHTML = html;
  
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (confirm('Delete this record?')) {
        await deleteDoc(doc(db, 'attendance', btn.dataset.date));
        toast('Deleted');
        renderDashboard();
        renderHistoryWithGroups();
        if (currentMonday) loadWeeklyReportForDate(currentMonday);
      }
    });
  });
}

function populateMonthFilter() {
  let sel = document.getElementById('hist-filter');
  let now = new Date();
  sel.innerHTML = '<option value="all">📅 All Time</option>';
  for (let i = 0; i < 13; i++) {
    let d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    let val = d.toISOString().slice(0,7);
    let lbl = d.toLocaleString('default', { month: 'long', year: 'numeric' });
    let opt = document.createElement('option');
    opt.value = val;
    opt.textContent = lbl;
    sel.appendChild(opt);
  }
}

document.getElementById('hist-filter').addEventListener('change', renderHistoryWithGroups);
</script>
