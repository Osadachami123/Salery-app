<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Tracker - OT Dropdown Selector</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#05070c;
  color:#f1f5f9;
  font-family:'DM Sans',sans-serif;
  padding:20px;
  max-width:500px;
  margin:0 auto;
}
.card{
  background:#0f1622;
  border:1px solid #1e293b;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}
label{
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  color:#94a3b8;
  display:block;
  margin-bottom:6px;
}
input, select{
  width:100%;
  background:#0a0f16;
  border:1.5px solid #1e293b;
  border-radius:14px;
  padding:12px 14px;
  color:#f1f5f9;
  font-size:15px;
  margin-bottom:12px;
}
button{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:white;
  font-weight:600;
  padding:12px 20px;
  border:none;
  border-radius:14px;
  width:100%;
  cursor:pointer;
}
.ot-hint{
  background:#0a0f16;
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  color:#f59e0b;
  margin-top:4px;
}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
</style>
</head>
<body>

<h1>💰 Salary Tracker</h1>
<p style="margin-bottom:20px;color:#94a3b8;">✅ දවස + පැය select කරන්න dropdown එකෙන්</p>

<!-- SINGLE DAY MARKING -->
<div class="card">
  <h3>📅 එක දවසක් Mark කරන්න</h3>
  
  <label>📆 දිනය තෝරන්න</label>
  <input type="date" id="att-date">
  
  <label>📋 වැඩ වර්ගය</label>
  <select id="att-type">
    <option value="work">💼 Work Day (සාමාන්‍ය දවස)</option>
    <option value="sunday">☀️ Sunday (ඉරිදා)</option>
    <option value="off">😴 Off Day (නිවාඩු)</option>
  </select>
  
  <label>⏰ Overtime පැය ගණන (dropdown එකෙන් තෝරන්න)</label>
  <select id="att-ot-select">
    <option value="0">0 පැය - OT නැත</option>
    <option value="0.5">0.5 පැය (විනාඩි 30) ⭐</option>
    <option value="1">1 පැය</option>
    <option value="1.5">1.5 පැය</option>
    <option value="2">2 පැය</option>
    <option value="2.5">2.5 පැය</option>
    <option value="3">3 පැය</option>
    <option value="3.5">3.5 පැය</option>
    <option value="4">4 පැය</option>
    <option value="5">5 පැය</option>
    <option value="6">6 පැය</option>
  </select>
  
  <div class="ot-hint" id="ot-hint">💰 OT එකෙන් ලැබෙන ගාන: Rs. 0</div>
  
  <button id="btn-save">✅ Save කරන්න</button>
</div>

<!-- RANGE MARKING -->
<div class="card">
  <h3>📆 දවස් ගානක් එක පාරටම Mark කරන්න</h3>
  
  <div class="grid-2">
    <div><label>From</label><input type="date" id="range-from"></div>
    <div><label>To</label><input type="date" id="range-to"></div>
  </div>
  
  <label>Day Type</label>
  <select id="range-type">
    <option value="work">Work Days (සෙනසුරාදා ඇතුළුව, ඉරිදා skip)</option>
    <option value="all-work">සියලු දවස් Work</option>
    <option value="sunday">සියල්ල Sunday</option>
    <option value="off">සියල්ල Off</option>
  </select>
  
  <label>⏰ සෑම දවසකටම OT පැය (dropdown)</label>
  <select id="range-ot-select">
    <option value="0">0 hrs</option>
    <option value="0.5">0.5 hrs</option>
    <option value="1">1 hr</option>
    <option value="1.5">1.5 hrs</option>
    <option value="2">2 hrs</option>
    <option value="2.5">2.5 hrs</option>
    <option value="3">3 hrs</option>
    <option value="4">4 hrs</option>
  </select>
  
  <button id="btn-range-preview" style="background:linear-gradient(135deg,#3b82f6,#2563eb);margin-bottom:12px;">👁️ Preview කරන්න</button>
  <div id="range-preview" style="font-size:13px;color:#94a3b8;margin-bottom:12px;"></div>
  <button id="btn-range-save" style="display:none;background:linear-gradient(135deg,#10b981,#16a34a);">💾 මේ සියල්ල Save කරන්න</button>
</div>

<!-- HISTORY -->
<div class="card">
  <h3>📜 ඉතිහාසය</h3>
  <select id="hist-filter" style="margin-bottom:12px;">
    <option value="all">සියල්ල</option>
  </select>
  <div id="history-list" style="max-height:300px;overflow-y:auto;"></div>
</div>

<script>
// Firebase config (same as before)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7L_dB7gZWKk0EVE1xNs4egkxjwHFTLiE",
  authDomain: "my-salary-tracker-be4a5.firebaseapp.com",
  projectId: "my-salary-tracker-be4a5",
  storageBucket: "my-salary-tracker-be4a5.firebasestorage.app",
  messagingSenderId: "202519677110",
  appId: "1:202519677110:web:d828b2e26b2063cac9fe17"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let RATES = { daily: 1750, ot: 218, sunday: 1750 };

function toast(msg) {
  alert(msg); // simple for demo
}

// OT hint update
const otSelect = document.getElementById('att-ot-select');
const otHint = document.getElementById('ot-hint');
function updateOtHint() {
  let val = parseFloat(otSelect.value) || 0;
  otHint.innerHTML = `💰 OT එකෙන් ලැබෙන ගාන: Rs. ${(val * RATES.ot).toLocaleString()}`;
}
otSelect.addEventListener('change', updateOtHint);

// Save single day
document.getElementById('btn-save').addEventListener('click', async () => {
  const date = document.getElementById('att-date').value;
  const type = document.getElementById('att-type').value;
  const ot = parseFloat(otSelect.value) || 0;
  if (!date) { toast("දවසක් තෝරන්න"); return; }
  await setDoc(doc(db, 'attendance', date), { type, ot });
  toast("✅ සුරකින ලදී");
  loadHistory();
});

// Range preview & save
let previewDays = [];
document.getElementById('btn-range-preview').addEventListener('click', () => {
  const from = document.getElementById('range-from').value;
  const to = document.getElementById('range-to').value;
  if (!from || !to) { toast("From & To තෝරන්න"); return; }
  const rangeType = document.getElementById('range-type').value;
  const ot = parseFloat(document.getElementById('range-ot-select').value) || 0;
  
  let dates = [];
  let d = new Date(from);
  while (d <= new Date(to)) {
    dates.push(new Date(d).toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
  }
  
  previewDays = dates.map(date => {
    let dow = new Date(date).getDay();
    let type = null;
    if (rangeType === 'work') type = dow === 0 ? null : 'work';
    else if (rangeType === 'all-work') type = 'work';
    else if (rangeType === 'sunday') type = 'sunday';
    else type = 'off';
    return type ? { date, type, ot: (type === 'off' ? 0 : ot) } : null;
  }).filter(Boolean);
  
  document.getElementById('range-preview').innerHTML = previewDays.map(d => 
    `📅 ${d.date} - ${d.type} ${d.ot ? `+${d.ot}h OT` : ''}`
  ).join('<br>');
  document.getElementById('btn-range-save').style.display = 'block';
});

document.getElementById('btn-range-save').addEventListener('click', async () => {
  if (!previewDays.length) return;
  const batch = writeBatch(db);
  previewDays.forEach(d => batch.set(doc(db, 'attendance', d.date), { type: d.type, ot: d.ot }));
  await batch.commit();
  toast(`✅ ${previewDays.length} දවස් සුරකින ලදී`);
  document.getElementById('range-preview').innerHTML = '';
  document.getElementById('btn-range-save').style.display = 'none';
  loadHistory();
});

// Load history
async function loadHistory() {
  const snap = await getDocs(collection(db, 'attendance'));
  let records = [];
  snap.forEach(d => records.push({ date: d.id, ...d.data() }));
  records.sort((a,b) => b.date.localeCompare(a.date));
  
  const container = document.getElementById('history-list');
  if (records.length === 0) {
    container.innerHTML = '<div style="color:#6b7280;text-align:center;">No records yet</div>';
    return;
  }
  
  container.innerHTML = records.map(rec => {
    let earn = 0;
    if (rec.type === 'work') earn = RATES.daily + (rec.ot || 0) * RATES.ot;
    else if (rec.type === 'sunday') earn = RATES.sunday + (rec.ot || 0) * RATES.ot;
    else earn = 0;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e293b;">
        <div><strong>${rec.date}</strong><br><span style="font-size:11px;color:#94a3b8;">${rec.type} ${rec.ot ? rec.ot+'h OT' : ''}</span></div>
        <div style="color:#10b981;">Rs. ${earn.toLocaleString()}</div>
        <button onclick="deleteDay('${rec.date}')" style="width:auto;padding:6px 12px;background:#f43f5e;">Delete</button>
      </div>
    `;
  }).join('');
}

window.deleteDay = async (date) => {
  if (confirm(`Delete ${date}?`)) {
    await deleteDoc(doc(db, 'attendance', date));
    loadHistory();
  }
};

// Auth and init
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    let email = prompt("Email:");
    let pwd = prompt("Password:");
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
    } catch(e) {
      alert("Login failed");
    }
  } else {
    document.getElementById('att-date').value = new Date().toISOString().slice(0,10);
    updateOtHint();
    loadHistory();
  }
});
</script>
</body>
</html>
